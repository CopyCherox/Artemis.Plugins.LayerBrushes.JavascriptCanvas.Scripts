<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Canvas Scripts</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main>
        <div class="hero">
            <h1>🎨 JavaScript Canvas Scripts</h1>
        </div>

        <div class="scripts-grid" id="scripts-grid">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <div class="install-guide">
            <h2>How to Install</h2>
            <ol>
                <li>Download a script by clicking any card above</li>
                <li>Open Artemis → Add JavaScript Canvas layer brush</li>
                <li>Click "Import..." → Select the .json file</li>
                <li>Select the script and click "Apply Changes to Layer Brush"</li>
            </ol>
        </div>

        <footer class="site-footer">
            <div class="container">
                <p>
                    &copy; 2025 <a href="https://github.com/CopyCherox">CopyCherox</a> |
                    <a href="https://github.com/CopyCherox/Artemis.Plugins.LayerBrushes.JavascriptCanvas.Scripts">Source</a>
                </p>
            </div>
        </footer>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
